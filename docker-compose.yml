version: '3.8'

services:
  backend:
    build: .
    container_name: event-aggregator-backend
    ports:
      - "8080:8080"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
    volumes:
      - ./data:/root/data
      - ./config.yaml:/root/config.yaml
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - event-aggregator

  frontend:
    build: ./web
    container_name: event-aggregator-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - event-aggregator

volumes:
  data:
    driver: local

networks:
  event-aggregator:
    driver: bridge 